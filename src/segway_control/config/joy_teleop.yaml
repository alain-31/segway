joy_teleop:
  ros__parameters:
    move:
      type: topic
      interface_type: geometry_msgs/msg/Twist
      topic_name: /segway/cmd_vel
      deadman_buttons: [4]

      axis_mappings:
        linear-x:
          axis: 1
          target: linear.x
          scale: 0.04
          offset: 0.0

        angular-z:
          axis: 3
          target: angular.z
          scale: 1.0
          offset: 0.0