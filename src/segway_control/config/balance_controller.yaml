balance_controller:
  ros__parameters:
    # ── Topics ──────────────────────────────────────────────────────────────
    imu_topic: /segway/imu/filtered
    odom_topic: /segway/odom
    cmd_vel_topic: /segway/cmd_vel

    # ── Setpoint ────────────────────────────────────────────────────────────
    pitch_setpoint: 0.0

    # ════════════════════════════════════════════════════════════════════════
    # INNER LOOP — pitch balance
    # ════════════════════════════════════════════════════════════════════════
    kp: 6.0
    ki: 0.0
    kd: 0.0575

    integral_max: 0.2
    output_max: 0.35
    deadband: 0.0
    pitch_limit: 0.5

    # ════════════════════════════════════════════════════════════════════════
    # OUTER LOOP — velocity control
    # ════════════════════════════════════════════════════════════════════════
    vel_kp: 0.155
    vel_ki: 0.003
    vel_kd: 0.0

    pitch_setpoint_max: 0.045
    vel_integral_max: 0.22
    vx_deadzone: 0.003
    vel_integral_leak: 0.97
    vel_d_max: 0.004

    # ── Debug ───────────────────────────────────────────────────────────────
    publish_debug: true
